<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Password - CampusTrade</title>
    
    <!-- 1. Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Load Google Font (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@800&display=swap" rel="stylesheet">
    
    <!-- 3. Configure Tailwind to use Inter font and brand colors -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        cursive: ['Dancing Script', 'cursive'],
                        poppins: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        'brand-purple': '#6B21A8',
                        'brand-pink': '#DF3B9F',
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
</head>
<body class="font-sans antialiased text-gray-900 bg-gray-100">

    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8 space-y-6">
            <div class="text-center">
                <a href="home.html" class="flex items-center justify-center space-x-2">
                    <svg class="w-8 h-8 text-brand-purple" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                    </svg>
                    <span class="font-poppins font-extrabold text-2xl text-gray-900 flex items-center">
                        Campus<span class="font-cursive text-3xl ml-1">Trade</span>
                    </span>
                </a>
                <h2 class="mt-6 text-3xl font-bold text-gray-900">Create a New Password</h2>
                <p class="mt-2 text-gray-600">Your new password must be different from previous ones.</p>
            </div>
            
            <form id="reset-password-form" class="space-y-6">
                <div>
                    <label for="new-password" class="text-sm font-medium text-gray-700">New Password</label>
                    <input id="new-password" name="new-password" type="password" required class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-brand-purple focus:border-brand-purple sm:text-sm">
                </div>

                <div>
                    <label for="confirm-password" class="text-sm font-medium text-gray-700">Confirm New Password</label>
                    <input id="confirm-password" name="confirm-password" type="password" required class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-brand-purple focus:border-brand-purple sm:text-sm">
                </div>

                <div>
                    <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-lg text-base font-medium text-white bg-gradient-to-r from-brand-pink to-brand-purple hover:opacity-90 transition-opacity">Reset Password</button>
                </div>
            </form>
        </div>
    </div>
    <div class="mt-4 flex justify-center">
        <a href="index.html"
       class="inline-flex items-center px-6 py-3 rounded-xl border border-brand-purple text-brand-purple font-semibold hover:bg-brand-purple hover:text-white transition-all duration-300">
        ← Back to Login
        </a>
    </div>

    <script>
    // Listen for Supabase confirming the recovery link
    supabaseClient.auth.onAuthStateChange(async (event, session) => {
        if (event === 'PASSWORD_RECOVERY') {
            console.log('Ready to set a new password.');
        }
    });

    document.getElementById('reset-password-form').addEventListener('submit', async function(event) {
        event.preventDefault();
        const newPassword = document.getElementById('new-password');
        const confirmPassword = document.getElementById('confirm-password');

        if (newPassword.value.trim() === '') {
            alert('Password cannot be empty.');
            return;
        }
        if (newPassword.value.length < 6) {
            alert('Password must be at least 6 characters.');
            return;
        }
        if (newPassword.value !== confirmPassword.value) {
            alert('Passwords do not match.');
            newPassword.classList.add('border-red-500');
            confirmPassword.classList.add('border-red-500');
            return;
        }

        const submitButton = event.target.querySelector('button[type="submit"]');
        submitButton.disabled = true;
        submitButton.textContent = 'Resetting...';

        const { error } = await supabaseClient.auth.updateUser({
            password: newPassword.value
        });

        submitButton.disabled = false;
        submitButton.textContent = 'Reset Password';

        if (error) {
            alert('Error: ' + error.message);
            return;
        }

        alert('Password has been reset successfully! Please sign in.');
        window.location.href = 'index.html';
    });
</script>

</body>
</html>
