<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wishlist - CampusTrade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        cursive: ['Dancing Script', 'cursive'],
                        poppins: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        'brand-purple': '#6B21A8',
                        'brand-pink': '#DF3B9F',
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
</head>
<body class="font-sans antialiased text-gray-900 bg-gray-50">
<div class="min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-100 sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20 gap-4">
                <a href="home.html" class="flex items-center space-x-2 shrink-0">
                    <svg class="w-8 h-8 text-brand-purple" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                    </svg>
                    <span class="font-poppins font-extrabold text-2xl text-gray-900 flex items-center">Campus<span class="font-cursive text-3xl ml-1">Trade</span></span>
                </a>
                <div class="flex items-center gap-4 sm:gap-6 text-sm font-medium text-gray-600 overflow-x-auto">
                    <a href="home.html" class="hover:text-brand-purple">Home</a>
                    <a href="cart.html" class="hover:text-brand-purple ">Cart</a>
                    <a href="wishlist.html" class="hover:text-brand-purple text-brand-purple font-semibold">Wishlist</a>
                    <a href="notifications.html" class="hover:text-brand-purple ">Alerts</a>
                    <a href="profile.html" class="hover:text-brand-purple">Profile</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="flex-grow">
        <section class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div class="flex items-center justify-between flex-wrap gap-3">
                <h1 class="text-3xl font-bold text-gray-900">Your Wishlist</h1>
                
            </div>
            <p id="summary" class="mt-2 text-gray-600"></p>
            <div id="items" class="mt-8 space-y-4">
                <p class="text-gray-500">Loading...</p>
            </div>
        </section>
    </main>

    <footer class="bg-gray-900 text-gray-400">
        <div class="max-w-7xl mx-auto px-4 py-6 text-center">
            <p class="text-sm text-gray-500">&copy; 2024 CampusTrade. All rights reserved. Made with <span class="text-red-500">&hearts;</span> for students.</p>
        </div>
    </footer>
</div>

<script>
function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

(async function() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    const userId = session.user.id;
    const list = document.getElementById('items');
    const summary = document.getElementById('summary');

    async function load() {
        const { data, error } = await supabaseClient
            .from('wishlist_items')
            .select('id, listing_id, listings(*)')
            .eq('user_id', userId)
            .order('created_at', { ascending: false });

        if (error) { list.innerHTML = '<p class="text-red-500">Error: ' + esc(error.message) + '</p>'; return; }

        const rows = (data || []).filter(r => r.listings);
        if (rows.length === 0) {
            summary.textContent = '';
            list.innerHTML = `
                <div class="text-center py-16 bg-white rounded-lg shadow-sm">
                    <h3 class="text-lg font-medium text-gray-900">Your wishlist is empty</h3>
                    <p class="mt-1 text-sm text-gray-500">Save items here to come back to them later.</p>
                    <a href="home.html" class="mt-6 inline-flex items-center px-4 py-2 text-sm font-medium rounded-md text-white bg-brand-purple hover:bg-brand-pink">Browse Items</a>
                </div>`;
            return;
        }

        summary.textContent = rows.length + (rows.length === 1 ? ' saved item' : ' saved items');

        list.innerHTML = rows.map(r => {
            const item = r.listings;
            return `
            <div class="bg-white rounded-lg shadow-sm p-4 flex gap-4 items-center">
                <img src="${esc(item.image_url || 'https://via.placeholder.com/120x120?text=Item')}" alt="${esc(item.title)}" class="w-20 h-20 sm:w-24 sm:h-24 object-cover rounded-md shrink-0">
                <div class="flex-1 min-w-0">
                    <h3 class="font-semibold text-gray-900 truncate">${esc(item.title)}</h3>
                    <p class="text-sm text-gray-500 truncate">${esc(item.category || '')}${item.address ? ' · ' + esc(item.address) : ''}</p>
                    <p class="mt-1 text-brand-purple font-bold">₹${esc(item.price)}</p>
                </div>
                <div class="flex flex-col gap-2 shrink-0">
                    <button data-cart="${esc(r.listing_id)}" data-seller="${esc(item.seller_id)}" data-title="${esc(item.title)}" class="text-sm font-medium px-3 py-1.5 rounded-md text-white bg-brand-purple hover:bg-brand-pink">Add to Cart</button>
                    <button data-remove="${esc(r.id)}" class="text-sm font-medium text-red-500 hover:text-red-700">Remove</button>
                </div>
            </div>`;
        }).join('');
    }

    list.addEventListener('click', async function(e) {
        const removeBtn = e.target.closest('[data-remove]');
        if (removeBtn) {
            removeBtn.disabled = true;
            await supabaseClient.from('wishlist_items').delete().eq('id', removeBtn.dataset.remove);
            load();
            return;
        }

        const cartBtn = e.target.closest('[data-cart]');
        if (cartBtn) {
            if (cartBtn.dataset.seller === userId) { alert('This is your own listing.'); return; }
            cartBtn.disabled = true;
            const { error } = await supabaseClient.from('cart_items').insert({
                user_id: userId,
                listing_id: cartBtn.dataset.cart
            });
            if (error && error.code !== '23505') {
                alert('Error: ' + error.message);
                cartBtn.disabled = false;
                return;
            }
            if (!error) {
                await supabaseClient.from('notifications').insert({
                    user_id: cartBtn.dataset.seller,
                    message: 'Someone added your item "' + cartBtn.dataset.title + '" to their cart.'
                });
            }
            cartBtn.textContent = 'In Cart ✓';
        }
    });

    load();
})();

</script>
</body>
</html>
