<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Campus EssentialHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;500;600;700;800;900&family=Poppins:wght@800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        cursive: ['Dancing Script', 'cursive'],
                        poppins: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        'brand-purple': '#6B21A8',
                        'brand-pink': '#DF3B9F',
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
</head>
<body class="font-sans antialiased text-gray-900 bg-gray-50">
<div class="min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-100 sticky top-0 z-50">
        <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20 gap-4">
                <a href="home.html" class="flex items-center space-x-2 shrink-0">
                    <svg class="w-8 h-8 text-brand-purple" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 10-7.5 0v4.5m11.356-1.993l1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 01-1.12-1.243l1.264-12A1.125 1.125 0 015.513 7.5h12.974c.576 0 1.059.435 1.119 1.007zM8.625 10.5a.375.375 0 11-.75 0 .375.375 0 01.75 0zm7.5 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z" />
                    </svg>
                    <span class="font-poppins font-extrabold text-2xl text-gray-900 flex items-center">Campus Essential <span class="font-cursive text-3xl ml-1">Hub</span></span>
                </a>
                <div class="flex items-center gap-4 sm:gap-6 text-sm font-medium text-gray-600 overflow-x-auto">
                    <a href="home.html" class="hover:text-brand-purple">Home</a>
                    <a href="cart.html" class="hover:text-brand-purple ">Cart</a>
                    <a href="wishlist.html" class="hover:text-brand-purple ">Wishlist</a>
                    <a href="notifications.html" class="hover:text-brand-purple text-brand-purple font-semibold">Alerts</a>
                    <a href="profile.html" class="hover:text-brand-purple">Profile</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="flex-grow">
        <section class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div class="flex items-center justify-between flex-wrap gap-3">
                <h1 class="text-3xl font-bold text-gray-900">Notifications</h1>
                <button id="mark-all-read" class="hidden text-sm font-medium text-brand-purple hover:text-brand-pink">Mark all as read</button>
            </div>
            <p id="summary" class="mt-2 text-gray-600"></p>
            <div id="items" class="mt-8 space-y-4">
                <p class="text-gray-500">Loading...</p>
            </div>
        </section>
    </main>

    <footer class="bg-gray-900 text-gray-400">
        <div class="max-w-7xl mx-auto px-4 py-6 text-center">
            <p class="text-sm text-gray-500">&copy; 2024 Campus EssentialHub. All rights reserved. Made with <span class="text-red-500">&hearts;</span> for students.</p>
        </div>
    </footer>
</div>

<script>
function esc(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

(async function() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) { window.location.href = 'index.html'; return; }
    const userId = session.user.id;
    const list = document.getElementById('items');
    const summary = document.getElementById('summary');
    const markAllBtn = document.getElementById('mark-all-read');

    function timeAgo(iso) {
        const secs = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
        if (secs < 60) return 'just now';
        if (secs < 3600) return Math.floor(secs / 60) + ' min ago';
        if (secs < 86400) return Math.floor(secs / 3600) + ' hr ago';
        return Math.floor(secs / 86400) + ' day(s) ago';
    }

    async function load() {
        const { data, error } = await supabaseClient
            .from('notifications')
            .select('*')
            .eq('user_id', userId)
            .order('created_at', { ascending: false });

        if (error) { list.innerHTML = '<p class="text-red-500">Error: ' + esc(error.message) + '</p>'; return; }

        if (!data || data.length === 0) {
            summary.textContent = '';
            markAllBtn.classList.add('hidden');
            list.innerHTML = `
                <div class="text-center py-16 bg-white rounded-lg shadow-sm">
                    <h3 class="text-lg font-medium text-gray-900">You have no notifications</h3>
                    <p class="mt-1 text-sm text-gray-500">You'll see an alert here when someone saves or adds your item.</p>
                </div>`;
            return;
        }

        const unread = data.filter(n => !n.is_read).length;
        summary.textContent = unread > 0 ? unread + ' unread' : 'All caught up';
        markAllBtn.classList.toggle('hidden', unread === 0);

        list.innerHTML = data.map(n => `
            <div class="rounded-lg shadow-sm p-4 flex gap-3 items-start ${n.is_read ? 'bg-white' : 'bg-purple-50 border border-purple-100'}">
                <div class="flex-1 min-w-0">
                    <p class="text-gray-900 ${n.is_read ? '' : 'font-semibold'}">${esc(n.message)}</p>
                    <p class="mt-1 text-xs text-gray-500">${timeAgo(n.created_at)}</p>
                </div>
                <button data-delete="${esc(n.id)}" class="text-sm text-gray-400 hover:text-red-500 shrink-0" aria-label="Delete notification">✕</button>
            </div>`).join('');
    }

    markAllBtn.addEventListener('click', async function() {
        await supabaseClient.from('notifications').update({ is_read: true }).eq('user_id', userId).eq('is_read', false);
        load();
    });

    list.addEventListener('click', async function(e) {
        const btn = e.target.closest('[data-delete]');
        if (!btn) return;
        await supabaseClient.from('notifications').delete().eq('id', btn.dataset.delete);
        load();
    });

    load();
})();

</script>
</body>
</html>
